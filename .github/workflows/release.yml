name: Create Release

on:
  release:
    types:
      - created
  workflow_dispatch: # For testing

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build

      - name: Create zip archive
        run: |
          mkdir systemscripts
          rsync -a --exclude-from=.distignore --exclude=systemscripts/ . systemscripts/
          zip -r systemscripts_${{ github.ref_name }}.zip systemscripts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: systemscripts_${{ github.ref_name }}.zip
